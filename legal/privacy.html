        <p

          <li
            data-en="Your mobile number. You give it to us to sign in, and we verify it with a one-time code sent by SMS."
            data-ar="رقم جوالك. تزوّدنا به لتسجيل الدخول، ونتحقق منه برمز لمرة واحدة يُرسل برسالة نصية."
          ></li>
          <li
            data-en="Your name and, if you choose to give one, your email address."
            data-ar="اسمك، وبريدك الإلكتروني إن اخترت تزويدنا به."
          ></li>
          <li
            data-en="Your delivery addresses, including any location you pin on the map, and any note you add for the driver."
            data-ar="عناوين التوصيل الخاصة بك، بما في ذلك أي موقع تحدده على الخريطة، وأي ملاحظة تضيفها للسائق."
          ></li>
          <li
            data-en="Your device location while you are choosing a delivery address, and only if you allow it. We do not collect your location in the background or when the app is closed."
            data-ar="موقع جهازك أثناء اختيارك عنوان التوصيل، وبإذنك وحدك. ولا نجمع موقعك في الخلفية ولا عند إغلاق التطبيق."
          ></li>
          <li
            data-en="Your orders: the items, the branch, the amounts, the VAT, any discount applied, and the payment method and status."
            data-ar="طلباتك: الأصناف، والفرع، والمبالغ، وضريبة القيمة المضافة، وأي خصم مطبَّق، وطريقة الدفع وحالته."
          ></li>
          <li
            data-en="Records of messages we send you about an order, and technical records of your use of the app that we keep for security and troubleshooting."
            data-ar="سجلات الرسائل التي نرسلها إليك بشأن طلبك، وسجلات تقنية لاستخدامك التطبيق نحتفظ بها لأغراض الأمن ومعالجة الأعطال."
          ></li>
        </ul>

        <h3 data-en="If you are one of our drivers" data-ar="إذا كنت أحد سائقينا"></h3>

            data-ar="بيانات الحساب التي يصدرها لك المطعم: الاسم، والبريد الإلكتروني، وبيانات المركبة والرخصة المسجّلة لك."
          ></li>
          <li
            data-en="Your device location, sent to us about every thirty seconds, only while you have picked up an order and have not yet delivered it, and only while the delivery screen is open. We do not track you between deliveries, and we do not track you in the background."
            data-ar="موقع جهازك، يُرسل إلينا كل ثلاثين ثانية تقريبًا، وذلك فقط بعد استلامك الطلب وقبل تسليمه، وفقط أثناء فتح شاشة التوصيل. ولا نتتبعك بين الطلبات، ولا نتتبعك في الخلفية."
          ></li>
          <li
            data-en="Your record of deliveries, any proof-of-delivery photo or signature you capture, and any cash you record as collected."
            data-ar="سجل توصيلاتك، وأي صورة أو توقيع تلتقطه كإثبات للتسليم، وأي مبالغ نقدية تسجّل تحصيلها."
          ></li>
        </ul>

        ></p>

                <td data-en="Performance of our contract with the customer, and our legitimate interests as the driver’s employer" data-ar="تنفيذ العقد المبرم مع العميل، ومصلحتنا المشروعة بصفتنا جهة عمل السائق"></td>
              </tr>

          </table>

        <p
          data-en="We do not use your personal data to build advertising profiles, we do not sell it, and we do not share it with anyone for their own marketing."
          data-ar="لا نستخدم بياناتك الشخصية لبناء ملفات إعلانية، ولا نبيعها، ولا نشاركها مع أي جهة لأغراضها التسويقية."

      <h2 id="share" data-en="4. Who we share it with" data-ar="٤. مع من نشاركها"></h2>
      <div class="card">
        <p
          data-en="We share only what each recipient needs, and only for the purposes above."
          data-ar="لا نشارك إلا القدر الذي يحتاجه كل متلقٍّ، وللأغراض المذكورة أعلاه فقط."
        ></p>
        <ul>
          <li
            data-en="The branch preparing your order, and the driver delivering it. A driver is given the delivery address, the name on the order, and — once they have collected your order — your mobile number, so they can call you if they cannot find you or reach the door. The number is not disguised. It is shown to them only while your delivery is on its way, and it is removed from their app once the delivery is finished."
            data-ar="الفرع الذي يحضّر طلبك، والسائق الذي يوصله. ويُزوَّد السائق بعنوان التوصيل وبالاسم المدوّن على الطلب، وبرقم جوالك بعد استلامه الطلب، ليتمكن من الاتصال بك إذا تعذّر عليه الوصول إليك أو إلى الباب. والرقم غير مُخفى، ويظهر له أثناء توصيل طلبك فقط، ويُزال من تطبيقه بمجرد اكتمال التوصيل."
          ></li>
          <li
            data-en="Our payment provider, [[ PAYMENT PROVIDER LEGAL NAME — TAP PAYMENTS OR AS CONTRACTED ]], which processes card payments and holds the card details we never see."
            data-ar="مزوّد الدفع لدينا، [[ الاسم النظامي لمزوّد الدفع — تاب للمدفوعات أو حسب التعاقد ]]، الذي ينفّذ مدفوعات البطاقات ويحتفظ ببيانات البطاقة التي لا نطّلع عليها."
          ></li>
          <li
            data-en="Our SMS provider, [[ SMS PROVIDER LEGAL NAME ]], which delivers your verification codes and order messages."
            data-ar="مزوّد الرسائل النصية لدينا، [[ الاسم النظامي لمزوّد الرسائل النصية ]]، الذي يوصل رموز التحقق ورسائل الطلبات إليك."
          ></li>
          <li
            data-en="Google, which provides the maps and location services used for the address picker and for navigation."
            data-ar="شركة قوقل، التي توفّر خدمات الخرائط والمواقع المستخدمة في تحديد العنوان وفي التوجيه الملاحي."
          ></li>
          <li

            data-ar="مزوّد الاستضافة لدينا، قوقل كلاود، الذي يشغّل الخوادم وقاعدة البيانات التي تعتمد عليها هذه الخدمة."

            data-ar="محاسبونا ومستشارونا المهنيون، وأي جهة مختصة أو محكمة يحق لها طلب المعلومات."
          ></li>

          data-en="Each of these acts on our written instructions and is bound to protect your data. [[ CONFIRM A WRITTEN PROCESSING AGREEMENT IS IN PLACE WITH EACH PROVIDER, AS THE IMPLEMENTING REGULATIONS REQUIRE ]]"

      <h2 id="where" data-en="5. Where it is stored, and transfers outside the Kingdom" data-ar="٥. أين تُخزَّن، ونقلها خارج المملكة"></h2>

        <p
          data-en="Your personal data is held on Google Cloud servers in [[ HOSTING REGION — THE SERVICE CURRENTLY RUNS IN GOOGLE CLOUD REGION me-central2, WHICH IS DOHA, QATAR. THIS IS A TRANSFER OUTSIDE THE KINGDOM AND MUST EITHER BE DISCLOSED HERE AND LAWFULLY SAFEGUARDED, OR THE SERVICE MOVED TO THE DAMMAM REGION (me-central2) BEFORE LAUNCH ]]."
          data-ar="تُحفظ بياناتك الشخصية على خوادم قوقل كلاود في [[ نطاق الاستضافة — تعمل الخدمة حاليًا في نطاق قوقل كلاود me-central2، وهو الدوحة في قطر. ويُعدّ ذلك نقلًا خارج المملكة يجب الإفصاح عنه هنا وتوفير ضماناته النظامية، أو نقل الخدمة إلى نطاق الدمام (me-central2) قبل الإطلاق ]]."
        ></p>
        <p
          data-en="Some of the providers listed above also process data outside the Kingdom. Where personal data leaves Saudi Arabia, the Personal Data Protection Law and the Regulation on Personal Data Transfer Outside the Kingdom require an appropriate basis and, in some cases, a documented risk assessment before the transfer takes place."
          data-ar="كما تعالج بعض الجهات المذكورة أعلاه البيانات خارج المملكة. وعندما تغادر البيانات الشخصية المملكة العربية السعودية، يوجب نظام حماية البيانات الشخصية ولائحة نقل البيانات الشخصية خارج المملكة وجود أساس مناسب، وفي بعض الحالات تقييم مخاطر موثّق قبل إجراء النقل."
        ></p>
        <p
          data-en="[[ STATE THE BASIS RELIED ON FOR EACH TRANSFER OUTSIDE THE KINGDOM, AND CONFIRM WHETHER THE REQUIRED RISK ASSESSMENT HAS BEEN CARRIED OUT AND DOCUMENTED. THIS IS A LAWYER’S ANSWER, NOT AN ENGINEERING ONE. ]]"
          data-ar="[[ يُذكر الأساس المعتمد لكل عملية نقل خارج المملكة، ويُتحقَّق من إجراء تقييم المخاطر المطلوب وتوثيقه. وهذا شأن المحامي لا الجهة التقنية. ]]"
        ></p>
      </div>

              <tr>
                <td data-en="The anonymised account record left after a deletion" data-ar="سجل الحساب المجهّل المتبقي بعد الحذف"></td>
                <td data-en="[[ RETENTION PERIOD BEFORE THE ANONYMISED RECORD IS PURGED ]]" data-ar="[[ مدة الاحتفاظ بالسجل المجهّل قبل إتلافه ]]"></td>
              </tr>
              <tr>
                <td data-en="Driver delivery records and proof of delivery" data-ar="سجلات توصيل السائقين وإثباتات التسليم"></td>
                <td data-en="[[ RETENTION PERIOD ]]" data-ar="[[ مدة الحفظ ]]"></td>
              </tr>
              <tr>
                <td data-en="Driver location points recorded during a delivery" data-ar="نقاط موقع السائق المسجّلة أثناء التوصيل"></td>
                <td data-en="[[ RETENTION PERIOD — WE RECOMMEND THE SHORTEST PERIOD THAT STILL ALLOWS A DELIVERY DISPUTE TO BE INVESTIGATED ]]" data-ar="[[ مدة الحفظ — نوصي بأقصر مدة تتيح مع ذلك التحقيق في أي نزاع يتعلق بالتوصيل ]]"></td>
              </tr>
              <tr>
                <td data-en="Technical and security logs" data-ar="السجلات التقنية والأمنية"></td>
                <td data-en="[[ RETENTION PERIOD ]]" data-ar="[[ مدة الحفظ ]]"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <h2 id="rights" data-en="7. Your rights, and how to use them" data-ar="٧. حقوقك وكيفية ممارستها"></h2>
      <div class="card">
        <p
          data-en="Under the Personal Data Protection Law you have the right to:"
          data-ar="بموجب نظام حماية البيانات الشخصية، يحق لك:"
        ></p>
        <ul>
          <li
            data-en="Be told what personal data we hold about you and how we use it — which is what this notice is for."
            data-ar="أن تُعلم بالبيانات الشخصية التي نحتفظ بها عنك وكيفية استخدامنا لها — وهو الغرض من هذا الإشعار."
          ></li>
          <li
            data-en="Ask for access to your personal data, and to be given a copy of it in a readable, commonly used format."
            data-ar="أن تطلب الاطلاع على بياناتك الشخصية، والحصول على نسخة منها بصيغة مقروءة وشائعة الاستخدام."
          ></li>
          <li
            data-en="Ask us to correct anything that is wrong, out of date or incomplete."
            data-ar="أن تطلب تصحيح أي بيانات غير صحيحة أو غير محدّثة أو ناقصة."
          ></li>
          <li
            data-en="Ask us to destroy your personal data where we no longer need it. This right does not extend to records we are legally required to keep, such as sales and VAT records."
            data-ar="أن تطلب إتلاف بياناتك الشخصية متى لم تعد لازمة لنا. ولا يمتد هذا الحق إلى السجلات التي يوجب النظام حفظها، كسجلات المبيعات وضريبة القيمة المضافة."
          ></li>
          <li
            data-en="Withdraw your consent, where we relied on consent to process your data."
            data-ar="أن تسحب موافقتك، متى كانت المعالجة قائمة على الموافقة."
          ></li>
        </ul>
        <p
          data-en="To use any of these, write to [[ PRIVACY CONTACT EMAIL ]]. We will respond within 30 days. If your request is unusually complex, or you have made several, we may need a further 30 days, and we will tell you before the first 30 days are up. We do not charge for this."
          data-ar="لممارسة أي من هذه الحقوق، راسلنا على [[ البريد الإلكتروني للخصوصية ]]. وسنرد خلال ثلاثين يومًا. وإذا كان طلبك بالغ التعقيد، أو تقدّمت بعدة طلبات، فقد نحتاج إلى ثلاثين يومًا إضافية، وسنخطرك بذلك قبل انقضاء المدة الأولى. ولا نتقاضى مقابلًا عن ذلك."
        ></p>
        <p
          data-en="You can also edit your name and manage your saved addresses yourself, at any time, from the Account screen in the app."
          data-ar="كما يمكنك تعديل اسمك وإدارة عناوينك المحفوظة بنفسك في أي وقت من شاشة الحساب في التطبيق."
        ></p>
      </div>

      <h2 id="deletion" data-en="8. Deleting your account" data-ar="٨. حذف حسابك"></h2>
      <div class="card">
        <p
          data-en="You can delete your account yourself, from Account → Delete my account in the app. We do not ask you to call or email us to do it."
          data-ar="يمكنك حذف حسابك بنفسك من: الحساب ← حذف حسابي داخل التطبيق. ولا نطالبك بالاتصال بنا أو مراسلتنا لإتمام ذلك."
        ></p>
        <p
          data-en="When you do, we erase your name, your email address and every saved address, including the map pins and any note you left for a driver. We release your mobile number, so it is free for you or anyone else to sign up with again. We sign you out on every device."
          data-ar="وعند قيامك بذلك، نمسح اسمك وبريدك الإلكتروني وجميع عناوينك المحفوظة، بما فيها المواقع على الخريطة وأي ملاحظة تركتها للسائق. ونحرّر رقم جوالك ليصبح متاحًا لك أو لغيرك للتسجيل به من جديد. ونسجّل خروجك من جميع أجهزتك."
        ></p>
        <p
          data-en="We do not delete your past orders, and we want to be exact about why. They are the restaurant’s record of a sale, and we are required to keep sales and VAT records. What we do instead is take your identity off them: after a deletion, those records no longer carry your name, your email address or your phone number."
          data-ar="ولا نحذف طلباتك السابقة، ونودّ أن نكون دقيقين في بيان السبب: فهي سجل المطعم للمبيعات، ونحن ملزمون بحفظ سجلات المبيعات وضريبة القيمة المضافة. وما نفعله بدلًا من ذلك هو إزالة هويتك منها: فبعد الحذف لا تحمل تلك السجلات اسمك ولا بريدك الإلكتروني ولا رقم جوالك."
        ></p>
        <p
          data-en="Any loyalty points on the account are lost when it is deleted, and cannot be restored afterwards."
          data-ar="وتفقد أي نقاط ولاء في الحساب عند حذفه، ولا يمكن استعادتها بعد ذلك."
        ></p>
      </div>

      <h2 id="security" data-en="9. Security and data breaches" data-ar="٩. الأمن وحوادث تسريب البيانات"></h2>
      <div class="card">
        <p
          data-en="We protect your data with measures appropriate to the risk: encrypted connections, access limited to the staff who need it, branch staff able to see only their own branch’s orders, and records of who changed what."
          data-ar="نحمي بياناتك بتدابير تتناسب مع المخاطر: اتصالات مشفّرة، ووصول مقصور على الموظفين الذين يحتاجونه، وموظفو الفرع لا يرون إلا طلبات فرعهم، وسجلات لمن غيّر ماذا."
        ></p>
        <p
          data-en="If a breach of your personal data occurs, we will notify the Saudi Data and Artificial Intelligence Authority within 72 hours of becoming aware of it, and we will tell you without undue delay where the breach is likely to cause you harm."
          data-ar="وفي حال وقوع تسريب لبياناتك الشخصية، سنخطر الهيئة السعودية للبيانات والذكاء الاصطناعي خلال ٧٢ ساعة من علمنا به، وسنخطرك دون تأخير غير مبرر متى كان التسريب مرجّح الإضرار بك."
        ></p>
        <p
          data-en="No system is perfectly secure. Keep your phone secure: anyone who can receive your verification code can sign in as you."
          data-ar="ولا يوجد نظام آمن تمامًا. فحافظ على أمان جوالك: فكل من يستطيع استلام رمز التحقق الخاص بك يستطيع الدخول باسمك."
        ></p>
      </div>

      <h2 id="children" data-en="10. Children" data-ar="١٠. الأطفال"></h2>
      <div class="card">
        <p
          data-en="This service is not intended for children, and accounts are for people who can enter into a contract. If you believe a child has given us personal data, contact us and we will remove it. [[ CONFIRM THE MINIMUM AGE AND ANY GUARDIAN-CONSENT REQUIREMENT WITH THE LAWYER ]]"
          data-ar="هذه الخدمة غير موجّهة للأطفال، والحسابات مخصّصة لمن تتوافر فيهم أهلية التعاقد. وإذا كنت ترى أن طفلًا زوّدنا ببيانات شخصية، فتواصل معنا وسنزيلها. [[ يُحدَّد السن الأدنى وأي اشتراط لموافقة ولي الأمر بالتشاور مع المحامي ]]"
        ></p>
      </div>

      <h2 id="changes" data-en="11. Changes to this notice" data-ar="١١. التعديلات على هذا الإشعار"></h2>
      <div class="card">
        <p
          data-en="We update this notice when what we do with your data changes. The version number and date at the top of this page tell you which version you are reading. Where a change materially affects you, we will tell you in the app before it takes effect."
          data-ar="نحدّث هذا الإشعار عند تغيّر ما نفعله ببياناتك. ويدل رقم النسخة والتاريخ في أعلى الصفحة على النسخة التي تقرؤها. وعندما يؤثر التعديل فيك تأثيرًا جوهريًا، سنخطرك داخل التطبيق قبل نفاذه."
        ></p>
      </div>

      <h2 id="contact" data-en="12. Contact and complaints" data-ar="١٢. التواصل والشكاوى"></h2>
      <div class="card">
        <p
          data-en="Talk to us first: [[ PRIVACY CONTACT EMAIL ]], or call the branch — the numbers are under Help & support in the app."
          data-ar="تواصل معنا أولًا عبر [[ البريد الإلكتروني للخصوصية ]]، أو اتصل بالفرع؛ وتجد الأرقام في «المساعدة والدعم» داخل التطبيق."
        ></p>
        <p
          data-en="If you are not satisfied with how we have handled your personal data, you have the right to complain to the Saudi Data and Artificial Intelligence Authority (SDAIA), which supervises the Personal Data Protection Law."
          data-ar="وإذا لم تكن راضيًا عن طريقة تعاملنا مع بياناتك الشخصية، فلك الحق في تقديم شكوى إلى الهيئة السعودية للبيانات والذكاء الاصطناعي (سدايا)، وهي الجهة المشرفة على تطبيق نظام حماية البيانات الشخصية."
        ></p>
      </div>

      <footer>
        <p
          data-en="Rami Broast. The data controller for the purposes of this notice is [[ RESTAURANT LEGAL NAME ]]."
          data-ar="رامي. الجهة المتحكمة في البيانات لأغراض هذا الإشعار هي [[ الاسم النظامي للمطعم ]]."
        ></p>
        <p><a href="./terms.html" data-en="Terms of service" data-ar="شروط الخدمة"></a></p>

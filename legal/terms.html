      <h2 id="parties" data-en="1. Who these terms are with" data-ar="١. أطراف هذه الشروط"></h2>
      <div class="card">
        <p
          data-en="These terms are an agreement between you and [[ RESTAURANT LEGAL NAME ]], a company registered in the Kingdom of Saudi Arabia under commercial registration number [[ CR NUMBER ]], VAT registration number [[ VAT NUMBER ]], with its registered address at [[ REGISTERED ADDRESS ]] (“we”, “us”, “the restaurant”)."
          data-ar="هذه الشروط اتفاق بينك وبين [[ الاسم النظامي للمطعم ]]، وهي شركة مسجّلة في المملكة العربية السعودية بالسجل التجاري رقم [[ رقم السجل التجاري ]]، والرقم الضريبي [[ الرقم الضريبي ]]، وعنوانها المسجّل [[ العنوان المسجّل ]] («نحن»، «المطعم»)."
        ></p>
        <p
          data-en="We sell and deliver our own food from our own branches, using our own delivery team. We are not a marketplace and we do not sell on behalf of anyone else."
          data-ar="نحن نبيع طعامنا ونوصله من فروعنا بأنفسنا وبفريق التوصيل التابع لنا. ولسنا منصة وساطة، ولا نبيع نيابة عن أي جهة أخرى."
        ></p>
        <p
          data-en="By placing an order you accept these terms. Please also read our privacy notice, which explains what we do with your personal data."
          data-ar="بتقديمك أي طلب فإنك تقبل هذه الشروط. ويُرجى الاطلاع أيضًا على إشعار الخصوصية لدينا، الذي يوضح ما نفعله ببياناتك الشخصية."
        ></p>
      </div>

      <h2 id="account" data-en="2. Your account" data-ar="٢. حسابك"></h2>
      <div class="card">
        <ul>
          <li
            data-en="You sign in with your mobile number and a one-time code we send by SMS. Keep your phone secure: anyone who can receive that code can order as you."
            data-ar="تسجّل الدخول برقم جوالك وبرمز لمرة واحدة نرسله برسالة نصية. فحافظ على أمان جوالك: فكل من يستطيع استلام ذلك الرمز يستطيع الطلب باسمك."
          ></li>
          <li
            data-en="An account is for your personal use. Give us accurate details, and keep your delivery addresses up to date — we deliver to the address on the order."
            data-ar="الحساب مخصّص لاستخدامك الشخصي. زوّدنا ببيانات صحيحة، وحافظ على تحديث عناوين التوصيل لديك؛ فنحن نوصل إلى العنوان المدوّن في الطلب."
          ></li>
          <li
            data-en="You can delete your account at any time from Account → Delete my account. Past orders remain as our sales and tax records, with your name and number removed from them — see the privacy notice."
            data-ar="يمكنك حذف حسابك في أي وقت من: الحساب ← حذف حسابي. وتبقى الطلبات السابقة ضمن سجلاتنا للمبيعات والسجلات الضريبية بعد إزالة اسمك ورقمك منها — راجع إشعار الخصوصية."
          ></li>
          <li
            data-en="We may suspend or close an account used for fraud, for abuse of our staff or drivers, or in breach of these terms. Where we do, we will tell you why unless we are prevented from doing so."
            data-ar="يجوز لنا إيقاف أو إغلاق أي حساب يُستخدم في الاحتيال أو في الإساءة إلى موظفينا أو سائقينا أو بالمخالفة لهذه الشروط. وعند فعل ذلك سنبيّن لك السبب ما لم يكن ثمة مانع نظامي."
          ></li>
        </ul>
      </div>

      <h2 id="ordering" data-en="3. Placing an order" data-ar="٣. تقديم الطلب"></h2>
      <div class="card">
        <ul>
          <li
            data-en="The menu in the app is an invitation to order, not an offer. Your order is an offer to buy, and a contract is formed only when the branch accepts it. Until then no contract exists."
            data-ar="قائمة الطعام في التطبيق دعوة إلى التعاقد لا إيجابًا. وطلبك يمثّل إيجابًا بالشراء، ولا ينعقد العقد إلا بقبول الفرع له. ولا يقوم عقد قبل ذلك."
          ></li>
          <li
            data-en="A branch may decline an order — if the kitchen is at capacity, if an item has just sold out, if the address is outside the area it delivers to, or if it reasonably suspects fraud. If we decline after taking payment, we refund it in full."
            data-ar="يجوز للفرع رفض الطلب — إذا امتلأ المطبخ، أو نفد أحد الأصناف، أو كان العنوان خارج نطاق التوصيل، أو قام لديه اشتباه معقول بالاحتيال. وإذا رفضنا الطلب بعد استيفاء قيمته، رددنا المبلغ كاملًا."
          ></li>
          <li
            data-en="Availability is per branch. An item shown as unavailable at your branch cannot be ordered from it, even if another branch has it."
            data-ar="يختلف التوافر من فرع إلى آخر. والصنف المعروض بأنه غير متوفر في فرعك لا يمكن طلبه منه، ولو توفّر في فرع آخر."
          ></li>
          <li
            data-en="Food descriptions and photographs are indicative. If you have an allergy or a dietary requirement, speak to the branch before ordering — the numbers are under Help & support. [[ ALLERGEN WORDING TO BE CONFIRMED — CHECK SFDA LABELLING AND ALLERGEN DISCLOSURE REQUIREMENTS FOR PREPARED FOOD SOLD ONLINE ]]"
            data-ar="أوصاف الأطعمة وصورها استرشادية. وإذا كان لديك حساسية أو متطلب غذائي، فتواصل مع الفرع قبل الطلب؛ وتجد الأرقام في «المساعدة والدعم». [[ تُراجَع صياغة بند المواد المسببة للحساسية — يُتحقَّق من متطلبات الهيئة العامة للغذاء والدواء بشأن بطاقة البيان والإفصاح عن مسببات الحساسية للأطعمة الجاهزة المباعة إلكترونيًا ]]"
          ></li>
        </ul>
      </div>

      <h2 id="prices" data-en="4. Prices, VAT and fees" data-ar="٤. الأسعار وضريبة القيمة المضافة والرسوم"></h2>
      <div class="card">
        <ul>
          <li
            data-en="All prices are in Saudi Riyals and include VAT at the applicable rate. The app shows how much of the total is VAT."
            data-ar="جميع الأسعار بالريال السعودي وشاملة لضريبة القيمة المضافة بالنسبة النظامية. ويبيّن التطبيق مقدار الضريبة المتضمَّنة في الإجمالي."
          ></li>
          <li
            data-en="Every amount — items, delivery fee, any other charge and any discount — is calculated on our servers and shown to you in full before you confirm. The total you approve is the total charged."
            data-ar="تُحتسب جميع المبالغ — الأصناف ورسوم التوصيل وأي رسوم أخرى وأي خصم — على خوادمنا وتُعرض لك كاملة قبل التأكيد. والمبلغ الذي توافق عليه هو المبلغ الذي يُخصم."
          ></li>
          <li
            data-en="Delivery orders are priced from the distance between the branch and the address on the order, and are subject to a minimum order value and a maximum distance. Both are shown at checkout when they apply."
            data-ar="تُسعَّر طلبات التوصيل بحسب المسافة بين الفرع والعنوان المدوّن في الطلب، وتخضع لحد أدنى لقيمة الطلب ولحدّ أقصى للمسافة، ويُعرض كلاهما عند الدفع متى انطبق."
          ></li>
          <li
            data-en="Some items cost more for delivery than for pickup. The app shows delivery prices while you browse, so a switch to pickup lowers the total rather than raising it."
            data-ar="تزيد أسعار بعض الأصناف في التوصيل عنها في الاستلام. ويعرض التطبيق أسعار التوصيل أثناء التصفح، بحيث يؤدي التحول إلى الاستلام إلى خفض الإجمالي لا رفعه."
          ></li>
          <li
            data-en="We may change prices at any time, but never for an order already placed."
            data-ar="يجوز لنا تعديل الأسعار في أي وقت، دون أن يمسّ ذلك أي طلب سبق تقديمه."
          ></li>
          <li
            data-en="A tax invoice for your order is issued by the restaurant separately. The order summary in the app is not a tax invoice."
            data-ar="تصدر الفاتورة الضريبية لطلبك من المطعم بشكل منفصل. وملخص الطلب في التطبيق ليس فاتورة ضريبية."
          ></li>
        </ul>
      </div>

      <h2 id="fulfilment" data-en="5. Delivery and pickup" data-ar="٥. التوصيل والاستلام"></h2>
      <div class="card">
        <ul>
          <li
            data-en="Delivery is made by our own team, from the branch nearest the address on your order. You cannot choose a different branch for delivery: the nearest one is what the fee is measured from and what arrives hot."
            data-ar="يتم التوصيل بواسطة فريقنا من الفرع الأقرب إلى العنوان المدوّن في طلبك. ولا يمكنك اختيار فرع آخر للتوصيل؛ فالفرع الأقرب هو ما تُقاس منه الرسوم وما يصل طعامه ساخنًا."
          ></li>
          <li
            data-en="Preparation and delivery times in the app are estimates, not guarantees."
            data-ar="أوقات التحضير والتوصيل في التطبيق تقديرية وليست مضمونة."
          ></li>
          <li
            data-en="Someone needs to be reachable at the address. If our driver cannot hand the order over after reasonable attempts, we may leave, and [[ STATE WHETHER THE ORDER IS CHARGED IN THAT CASE — A CONSUMER-FACING DECISION, AND ONE THE LAWYER SHOULD CHECK AGAINST THE E-COMMERCE LAW ]]."
            data-ar="ينبغي وجود من يمكن الوصول إليه في العنوان. وإذا تعذّر على سائقنا تسليم الطلب بعد محاولات معقولة، فقد ننصرف، و[[ يُبيَّن ما إذا كانت قيمة الطلب تُستحق في هذه الحالة — وهو قرار يمسّ المستهلك وينبغي أن يراجعه المحامي في ضوء نظام التجارة الإلكترونية ]]."
          ></li>
          <li
            data-en="For pickup you choose the branch and collect at the counter."
            data-ar="في حالة الاستلام تختار الفرع وتستلم طلبك من الكاشير."
          ></li>
          <li
            data-en="While a delivery is on its way you can see the driver’s position on the map. It updates about every thirty seconds and can be a few minutes old; the app tells you how recent it is."
            data-ar="أثناء وجود الطلب في الطريق يمكنك رؤية موقع السائق على الخريطة. ويُحدَّث كل ثلاثين ثانية تقريبًا وقد يتأخر بضع دقائق، ويبيّن لك التطبيق زمن آخر تحديث."
          ></li>
        </ul>
      </div>

      <h2 id="payment" data-en="6. Payment" data-ar="٦. الدفع"></h2>
      <div class="card">
        <ul>
          <li
            data-en="Card payments are processed by our payment provider on its own secure page. We never receive or store your card number."
            data-ar="تُنفَّذ مدفوعات البطاقات عبر مزوّد الدفع لدينا على صفحته الآمنة. ولا نستلم رقم بطاقتك ولا نخزّنه إطلاقًا."
          ></li>
          <li
            data-en="Cash on delivery is available only at branches that offer it, and the app tells you when it is not available."
            data-ar="الدفع عند الاستلام متاح فقط في الفروع التي توفّره، ويبيّن لك التطبيق متى كان غير متاح."
          ></li>
          <li
            data-en="A payment is confirmed by our payment provider, not by the app. If the app shows a payment as still processing, that is the honest state and it will settle shortly."
            data-ar="يُؤكَّد الدفع من مزوّد الدفع لا من التطبيق. وإذا أظهر التطبيق أن الدفع «قيد المعالجة»، فتلك هي الحالة الفعلية وستستقر بعد قليل."
          ></li>
          <li
            data-en="[[ CONFIRM WHETHER PAYMENT IS AUTHORISED AT PLACEMENT AND CAPTURED ON ACCEPTANCE, OR CHARGED IN FULL AT PLACEMENT. THE ANSWER CHANGES WHAT A CUSTOMER SEES ON THEIR STATEMENT AND SHOULD BE STATED HERE. ]]"
            data-ar="[[ يُحدَّد ما إذا كان المبلغ يُحجز عند تقديم الطلب ويُحصَّل عند القبول، أم يُخصم كاملًا عند تقديم الطلب. فالإجابة تغيّر ما يراه العميل في كشف حسابه وينبغي بيانها هنا. ]]"
          ></li>
        </ul>
      </div>

      <h2 id="cancel" data-en="7. Cancellation, complaints and refunds" data-ar="٧. الإلغاء والشكاوى واسترداد المبالغ"></h2>
      <div class="card">
        <p
          data-en="Food is prepared to order and is perishable, so an order cannot be returned once the kitchen has started on it. That is why the cancellation window is where it is."
          data-ar="يُحضَّر الطعام عند الطلب وهو قابل للتلف، فلا يمكن إرجاع الطلب بعد بدء المطبخ في تحضيره. ولهذا السبب حُددت مهلة الإلغاء على هذا النحو."
        ></p>
        <ul>
          <li
            data-en="You can cancel free of charge from the app at any time before the kitchen starts preparing your order."
            data-ar="يمكنك الإلغاء مجانًا من التطبيق في أي وقت قبل بدء المطبخ في تحضير طلبك."
          ></li>
          <li
            data-en="After that, contact the branch. Whether a cancellation is possible depends on how far the order has got."
            data-ar="وبعد ذلك، تواصل مع الفرع. ويتوقف إمكان الإلغاء على المرحلة التي بلغها الطلب."
          ></li>
          <li
            data-en="If your order arrives wrong, incomplete, or not in an acceptable condition, tell the branch as soon as you can and we will put it right — by replacing it or refunding it."
            data-ar="وإذا وصل طلبك خاطئًا أو ناقصًا أو بحالة غير مقبولة، فأبلغ الفرع في أقرب وقت وسنعالج الأمر — إما باستبداله أو برد قيمته."
          ></li>
          <li
            data-en="Refunds go back to the payment method you used. We start a refund as soon as it is agreed; how long it then takes to appear is up to your bank and is outside our control."
            data-ar="تُردّ المبالغ إلى وسيلة الدفع التي استخدمتها. ونبدأ إجراء الرد فور الاتفاق عليه، أما مدة ظهوره فتعود إلى مصرفك وهي خارجة عن سيطرتنا."
          ></li>
        </ul>
        <p
          data-en="[[ CONFIRM THIS SECTION AGAINST THE SAUDI E-COMMERCE LAW AND ITS IMPLEMENTING REGULATIONS. THE EXEMPTION FOR PERISHABLE AND MADE-TO-ORDER GOODS IS THE POINT TO CHECK, ALONG WITH THE REQUIRED COMPLAINT-HANDLING TIMESCALES. ]]"
          data-ar="[[ يُراجَع هذا البند في ضوء نظام التجارة الإلكترونية ولائحته التنفيذية. والنقطة محل التحقق هي الاستثناء الخاص بالسلع القابلة للتلف والمصنوعة حسب الطلب، إضافة إلى المدد النظامية لمعالجة الشكاوى. ]]"
        ></p>
      </div>

      <h2 id="offers" data-en="8. Offers, coupons and loyalty points" data-ar="٨. العروض والكوبونات ونقاط الولاء"></h2>
      <div class="card">
        <ul>
          <li
            data-en="A coupon applies only if its conditions are met — a minimum spend, a validity period, and sometimes a limit on how often it can be used. Checkout tells you when a code does not apply and prices your basket without it."
            data-ar="لا يُطبَّق الكوبون إلا عند استيفاء شروطه — حدّ أدنى للإنفاق، ومدة صلاحية، وأحيانًا حدّ لعدد مرات الاستخدام. وتخبرك صفحة الدفع عندما لا ينطبق الرمز وتحتسب سلتك من دونه."
          ></li>
          <li
            data-en="Some discounts apply automatically to a qualifying basket, with no code to enter. A coupon and an automatic discount do not combine: we apply whichever saves you more, and a coupon that loses is not used up."
            data-ar="تُطبَّق بعض الخصومات تلقائيًا على السلة المستوفية للشروط دون إدخال أي رمز. ولا يُجمع بين الكوبون والخصم التلقائي: بل نطبّق الأوفر لك، ولا يُستهلك الكوبون إذا كان الأقل قيمة."
          ></li>
          <li
            data-en="We can withdraw or change an offer at any time. An order already placed keeps the discount it was placed with."
            data-ar="يجوز لنا سحب أي عرض أو تعديله في أي وقت. ويحتفظ الطلب المقدَّم بالفعل بالخصم الذي قُدِّم به."
          ></li>
          <li
            data-en="Loyalty points have no cash value, cannot be transferred, and are lost if you delete your account. [[ STATE WHETHER POINTS EXPIRE, AND WHAT THEY CAN BE REDEEMED FOR, ONCE THE OWNER HAS DECIDED — REDEMPTION AND EXPIRY ARE NOT YET IMPLEMENTED ]]"
            data-ar="ليس لنقاط الولاء قيمة نقدية، ولا يمكن تحويلها، وتفقد عند حذف حسابك. [[ يُبيَّن ما إذا كانت النقاط تنتهي صلاحيتها وما الذي يمكن استبدالها به، بعد أن يقرر المالك ذلك — فالاستبدال وانتهاء الصلاحية غير مطبَّقين بعد ]]"
          ></li>
        </ul>
      </div>

      <h2 id="conduct" data-en="9. How the service may be used" data-ar="٩. ضوابط استخدام الخدمة"></h2>
      <div class="card">
        <p data-en="Please do not:" data-ar="يُرجى الامتناع عن:"></p>
        <ul>
          <li data-en="Order with someone else’s payment method or identity." data-ar="الطلب باستخدام وسيلة دفع أو هوية شخص آخر."></li>
          <li data-en="Place orders you do not intend to receive or pay for." data-ar="تقديم طلبات لا تنوي استلامها أو دفع قيمتها."></li>
          <li data-en="Abuse, threaten or endanger our staff or our drivers." data-ar="الإساءة إلى موظفينا أو سائقينا أو تهديدهم أو تعريضهم للخطر."></li>
